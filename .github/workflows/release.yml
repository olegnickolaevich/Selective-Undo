name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
      SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Version matches the tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -qE "^ \* Version: +$v$" selective-undo.php
          grep -qE "define\( 'SELECTIVE_UNDO_VERSION', '$v' \)" selective-undo.php
          grep -q "^Stable tag: $v$" readme.txt
      - run: bin/dist.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/selective-undo-*.zip
      - name: Deploy to WordPress.org
        if: env.SVN_USERNAME != ''
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SLUG: selective-undo
          BUILD_DIR: dist/selective-undo
          ASSETS_DIR: .wordpress-org
